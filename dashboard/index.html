<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sense — Companion Dashboard</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg-card: #16213e;
  --bg-hover: #1f2f50;
  --text: #e0e0e0;
  --text-dim: #8899aa;
  --accent: #7482f2;
  --useful: #4caf50;
  --noise: #f06070;
  --converging: #f0a050;
  --diverging: #5090f0;
  --stable: #888;
  --border: #2a3a5e;
  --font: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
header .meta { font-size: 11px; color: var(--text-dim); }

/* Summary grid */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  text-align: center;
}
.stat-card .value {
  font-size: 24px;
  font-weight: 700;
  display: block;
  margin-bottom: 2px;
}
.stat-card .label {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Panels */
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}
.panel h2 {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.panel.full-width { grid-column: 1 / -1; }

/* Trajectory sparkline */
.sparkline-container {
  height: 60px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  padding: 4px 0;
}
.spark-bar {
  flex: 1;
  min-width: 4px;
  max-width: 20px;
  border-radius: 2px 2px 0 0;
  transition: height 0.3s;
}

/* Hit rate bar */
.hit-rate-bar {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin: 8px 0;
}
.hit-rate-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s;
}

/* Query timeline */
.query-list { max-height: 400px; overflow-y: auto; }
.query-item {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.query-item:hover { background: var(--bg-hover); }
.query-item .query-text {
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.query-item .query-meta {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* Result items (expanded) */
.result-list { display: none; padding: 4px 0 4px 12px; }
.query-item.expanded .result-list { display: block; }
.result-item {
  padding: 6px 8px;
  margin: 4px 0;
  background: var(--bg);
  border-radius: 4px;
  font-size: 11px;
}
.result-item .file-path { color: var(--text); font-weight: 500; }
.result-item .result-meta { color: var(--text-dim); font-size: 10px; }

/* Label toggle */
.label-btn {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: var(--font);
  transition: all 0.2s;
}
.label-btn.useful { background: var(--useful); color: #fff; }
.label-btn.noise { background: var(--noise); color: #fff; }
.label-btn.unlabelled { background: var(--border); color: var(--text-dim); }
.label-btn:hover { opacity: 0.8; }
.label-btn.corrected { border-style: dashed; border-color: #fff; }

/* Trend indicator */
.trend { font-weight: 600; }
.trend.converging { color: var(--converging); }
.trend.diverging { color: var(--diverging); }
.trend.stable { color: var(--stable); }
.trend.insufficient_data { color: var(--text-dim); }

/* Mode badge */
.mode-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}
.mode-badge.explore { background: #3a4a3a; color: #8cc88c; }
.mode-badge.build { background: #2a3a5a; color: #7482f2; }
.mode-badge.think-with { background: #4a3a3a; color: #d4a0a0; }
.mode-badge.ship { background: #3a4a4a; color: #70c0c0; }
.mode-badge.cool-off { background: #3a3a3a; color: #9a9a9a; }

/* Feedback stream */
.feedback-list { max-height: 300px; overflow-y: auto; }
.feedback-item {
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.feedback-item .fb-path {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-right: 8px;
}
.feedback-item .fb-source {
  font-size: 9px;
  color: var(--text-dim);
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Sense Companion</h1>
    <div class="meta">
      <span id="poll-status">polling...</span>
      <span id="session-duration"></span>
    </div>
  </header>

  <!-- Summary cards (REQ-001) -->
  <div class="summary">
    <div class="stat-card">
      <span class="value" id="s-mode">—</span>
      <span class="label">Mode</span>
    </div>
    <div class="stat-card">
      <span class="value" id="s-queries">0</span>
      <span class="label">Queries</span>
    </div>
    <div class="stat-card">
      <span class="value" id="s-surfaced">0</span>
      <span class="label">Surfaced</span>
    </div>
    <div class="stat-card">
      <span class="value" id="s-hitrate">—</span>
      <span class="label">Hit Rate</span>
    </div>
    <div class="stat-card">
      <span class="value" id="s-trend">—</span>
      <span class="label">Trajectory</span>
    </div>
    <div class="stat-card">
      <span class="value" id="s-turns">0</span>
      <span class="label">Turns</span>
    </div>
  </div>

  <!-- Hit rate bar (REQ-004) -->
  <div class="panel full-width" style="margin-bottom: 12px;">
    <h2>Hit Rate</h2>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="hit-rate-bar" style="flex: 1;">
        <div class="hit-rate-fill" id="hitrate-bar" style="width: 0%; background: var(--useful);"></div>
      </div>
      <span id="hitrate-pct" style="font-size: 14px; font-weight: 600;">—</span>
    </div>
    <div style="font-size: 10px; color: var(--text-dim); margin-top: 4px;">
      <span id="hitrate-detail"></span>
    </div>
  </div>

  <div class="panels">
    <!-- Trajectory (REQ-005) -->
    <div class="panel">
      <h2>Trajectory</h2>
      <div id="traj-current" style="margin-bottom: 8px;"></div>
      <div class="sparkline-container" id="traj-sparkline"></div>
    </div>

    <!-- Feedback stream -->
    <div class="panel">
      <h2>Recent Feedback</h2>
      <div class="feedback-list" id="feedback-list"></div>
    </div>

    <!-- Query timeline (REQ-002) -->
    <div class="panel full-width">
      <h2>Query Timeline</h2>
      <div class="query-list" id="query-list"></div>
    </div>
  </div>
</div>

<script>
const API = '';
const POLL_MS = parseInt(new URLSearchParams(location.search).get('poll') || '3000');
const ECO_ROOT = '';  // server returns full paths; we'll strip common prefix

let lastFeedbackTs = 0;

function relTime(ts) {
  if (!ts) return '';
  const diff = (Date.now() / 1000) - ts;
  if (diff < 60) return Math.floor(diff) + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function relPath(fp) {
  // Strip common prefix up to EarthianLabs/
  const idx = fp.indexOf('EarthianLabs/');
  return idx >= 0 ? fp.slice(idx + 13) : fp;
}

function trendClass(trend) {
  return trend || 'insufficient_data';
}

// ---- Summary (REQ-001) ----

async function updateSummary() {
  try {
    const [session, mode, stats, traj] = await Promise.all([
      fetch(API + '/api/session').then(r => r.json()),
      fetch(API + '/api/mode').then(r => r.json()),
      fetch(API + '/api/feedback/stats').then(r => r.json()),
      fetch(API + '/api/trajectory').then(r => r.json()),
    ]);

    // Mode
    const m = mode.mode || 'none';
    const modeEl = document.getElementById('s-mode');
    modeEl.textContent = m;
    modeEl.className = 'value mode-badge ' + m;

    // Queries
    const queries = session.queries || [];
    document.getElementById('s-queries').textContent = queries.length;

    // Surfaced count
    const surfacedCount = Object.keys(session.surfaced || {}).length;
    document.getElementById('s-surfaced').textContent = surfacedCount;

    // Hit rate
    const hr = stats.recent_hit_rate != null ? stats.recent_hit_rate : stats.hit_rate;
    if (hr != null && stats.total > 0) {
      const pct = Math.round(hr * 100);
      document.getElementById('s-hitrate').textContent = pct + '%';
      document.getElementById('hitrate-bar').style.width = pct + '%';
      document.getElementById('hitrate-bar').style.background =
        pct >= 50 ? 'var(--useful)' : pct >= 25 ? 'var(--converging)' : 'var(--noise)';
      document.getElementById('hitrate-pct').textContent = pct + '%';
      document.getElementById('hitrate-detail').textContent =
        `${stats.useful} useful / ${stats.noise} noise (${stats.total} total)` +
        (stats.correction_rate != null ? ` · ${Math.round(stats.correction_rate * 100)}% correction rate` : '');
    } else {
      document.getElementById('s-hitrate').textContent = '—';
    }

    // Trajectory
    const current = traj.current || session.trajectory_signal || {};
    const trend = current.trend || 'insufficient_data';
    const trendEl = document.getElementById('s-trend');
    trendEl.textContent = trend;
    trendEl.className = 'value trend ' + trendClass(trend);

    document.getElementById('s-turns').textContent = current.turn_count || 0;

    // Trajectory detail
    const dk = current.delta_kappa;
    document.getElementById('traj-current').innerHTML =
      `<span class="trend ${trendClass(trend)}">${trend}</span>` +
      (dk != null ? ` <span style="color:var(--text-dim)">dk=${dk.toFixed(4)}</span>` : '') +
      ` <span style="color:var(--text-dim)">${current.turn_count || 0} turns</span>`;

    // Trajectory sparkline (REQ-005)
    const history = traj.history || [];
    const sparkEl = document.getElementById('traj-sparkline');
    sparkEl.innerHTML = '';
    if (history.length > 0) {
      const maxDk = Math.max(...history.map(h => Math.abs(h.delta_kappa || 0)), 0.01);
      for (const h of history.slice(-30)) {
        const bar = document.createElement('div');
        bar.className = 'spark-bar';
        const val = Math.abs(h.delta_kappa || 0);
        const pct = Math.min(100, (val / maxDk) * 100);
        bar.style.height = Math.max(4, pct) + '%';
        bar.style.background = h.trend === 'converging' ? 'var(--converging)' :
                               h.trend === 'diverging' ? 'var(--diverging)' : 'var(--stable)';
        bar.title = `${h.trend} dk=${(h.delta_kappa || 0).toFixed(4)} ${relTime(h.ts)}`;
        sparkEl.appendChild(bar);
      }
    }

    // Session duration
    if (queries.length > 0) {
      const firstTs = queries[0].ts;
      document.getElementById('session-duration').textContent =
        'Session: ' + relTime(firstTs).replace(' ago', '');
    }

    // Query timeline (REQ-002)
    updateQueryTimeline(queries, traj.history || []);

    document.getElementById('poll-status').textContent = 'live';
  } catch (e) {
    document.getElementById('poll-status').textContent = 'error';
    console.error('Poll error:', e);
  }
}

// ---- Query Timeline (REQ-002/003) ----

function updateQueryTimeline(queries, trajHistory) {
  const el = document.getElementById('query-list');

  // Build trajectory map by approximate timestamp
  const trajMap = {};
  for (const h of trajHistory) {
    trajMap[Math.floor(h.ts)] = h;
  }

  // Remember which items are expanded before rebuild
  const expandedSet = new Set();
  el.querySelectorAll('.query-item.expanded').forEach(item => {
    const ts = item.dataset.ts;
    if (ts) expandedSet.add(ts);
  });

  const reversed = [...queries].reverse();
  el.innerHTML = '';

  for (const q of reversed) {
    const item = document.createElement('div');
    const tsKey = String(Math.floor(q.ts));
    item.className = 'query-item' + (expandedSet.has(tsKey) ? ' expanded' : '');
    item.dataset.ts = tsKey;

    const qText = q.query || '';
    const truncated = qText.length > 100 ? qText.slice(0, 100) + '...' : qText;
    const files = q.surfaced_files || [];

    // Find closest trajectory signal
    const closestTs = Math.floor(q.ts);
    const trajH = trajMap[closestTs] || trajMap[closestTs - 1] || trajMap[closestTs + 1];
    const trendLabel = trajH ? `<span class="trend ${trendClass(trajH.trend)}">${trajH.trend}</span>` : '';

    item.innerHTML = `
      <div class="query-text" title="${qText.replace(/"/g, '&quot;')}">${truncated}</div>
      <div class="query-meta">
        ${relTime(q.ts)} · ${files.length} results ${trendLabel}
      </div>
      <div class="result-list" id="results-${closestTs}">
        ${files.map(fp => `
          <div class="result-item">
            <div class="file-path">${relPath(fp)}</div>
          </div>
        `).join('')}
      </div>
    `;

    // Toggle on header click only — stop result-list clicks from bubbling
    const header = item.querySelector('.query-text');
    const meta = item.querySelector('.query-meta');
    const toggle = (e) => { e.stopPropagation(); item.classList.toggle('expanded'); };
    header.addEventListener('click', toggle);
    meta.addEventListener('click', toggle);
    // Prevent clicks inside result list from collapsing
    item.querySelector('.result-list').addEventListener('click', (e) => e.stopPropagation());
    el.appendChild(item);
  }
}

// ---- Feedback stream ----

async function updateFeedback() {
  try {
    const rows = await fetch(API + '/api/feedback').then(r => r.json());
    const el = document.getElementById('feedback-list');
    el.innerHTML = '';

    for (const row of rows.slice(0, 50)) {
      const item = document.createElement('div');
      item.className = 'feedback-item';

      const source = row.source || 'manual';
      const isCorrected = source.startsWith('corrected:');

      item.innerHTML = `
        <span class="fb-path" title="${row.file_path}">${relPath(row.file_path)}</span>
        <span class="label-btn ${row.label} ${isCorrected ? 'corrected' : ''}"
              data-fp="${row.file_path}" data-qt="${row.query_text || ''}"
              data-label="${row.label}"
              onclick="toggleLabel(this)">${row.label}</span>
        <span class="fb-source">${source}</span>
      `;
      el.appendChild(item);
    }
  } catch (e) {
    console.error('Feedback error:', e);
  }
}

// ---- Label correction (REQ-007) ----

async function toggleLabel(btn) {
  const newLabel = btn.dataset.label === 'useful' ? 'noise' : 'useful';
  try {
    const resp = await fetch(API + '/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file_path: btn.dataset.fp,
        query_text: btn.dataset.qt,
        label: newLabel,
      }),
    });
    if (resp.ok) {
      btn.dataset.label = newLabel;
      btn.textContent = newLabel;
      btn.className = `label-btn ${newLabel} corrected`;
      // Refresh stats
      updateSummary();
      updateFeedback();
    }
  } catch (e) {
    console.error('Correction error:', e);
  }
}

// ---- Polling ----

async function poll() {
  await updateSummary();
  await updateFeedback();
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
