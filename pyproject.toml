[project]
name = "sense-mcp"
version = "0.1.0"
description = "Semantic retrieval MCP server for markdown-heavy project ecosystems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "numpy>=1.24",
    "tiktoken>=0.5",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[project.scripts]
sense-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
