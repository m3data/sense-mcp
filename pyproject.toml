[project]
name = "sense-mcp"
version = "0.4.1"
description = "Ambient relevance injection for AI conversations — indexes your project ecosystem, surfaces relevant context automatically"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "numpy>=1.24",
    "tiktoken>=0.5",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
sense-mcp = "sense_mcp.server:mcp.run"
sense-mcp-hook = "sense_mcp.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
